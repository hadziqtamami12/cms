<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Ultra-Performance Headless CMS & High-Converting Landing Page Engine" />
    <title>Rental Mobil & Armada Eksekutif | Layanan Terbaik 24 Jam</title>
    
    <!-- DNS Prefetch and Preconnect for CDN Images -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- High Priority Preload for First Slide Image (LCP < 1.2s guarantee) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600&auto=format&fit=crop"
      fetchpriority="high"
    />

    <!-- Critical Inlined CSS for Zero CLS & First Viewport Render -->
    <style>
      :root {
        color-scheme: light dark;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Zero CLS Skeleton shimmer baseline */
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
        background-color: #e2e8f0;
      }
      .dark .skeleton-shimmer {
        background-color: #1e293b;
      }
      .skeleton-shimmer::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.4) 20%,
          rgba(255, 255, 255, 0.7) 60%,
          rgba(255, 255, 255, 0)
        );
        animation: shimmer 1.8s infinite linear;
        content: '';
      }
      .dark .skeleton-shimmer::after {
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.05) 20%,
          rgba(255, 255, 255, 0.12) 60%,
          rgba(255, 255, 255, 0)
        );
      }
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
