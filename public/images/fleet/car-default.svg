<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <ellipse cx="400" cy="410" rx="320" ry="25" fill="#000000" opacity="0.4" />
  
  <!-- Sleek Modern Car Silhouette -->
  <g transform="translate(100, 160)">
    <!-- Cabin Glass -->
    <path d="M120 100 Q180 20 320 15 Q430 18 480 95 Z" fill="url(#glass)" />
    <!-- Pillars -->
    <path d="M280 20 L270 95 M380 25 L400 95" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <!-- Car Body -->
    <path d="M40 120 Q50 90 120 85 L480 85 Q540 85 570 120 L580 160 Q570 175 550 175 L50 175 Q30 175 25 155 Z" fill="url(#carBody)" />
    <!-- Headlight & Taillight -->
    <path d="M25 125 L55 128 L50 145 L20 140 Z" fill="#fef08a" />
    <path d="M570 125 L550 128 L555 145 L580 140 Z" fill="#ef4444" />
    <!-- Wheel Arches -->
    <path d="M90 175 A 45 45 0 0 1 190 175 Z" fill="#0f172a" />
    <path d="M420 175 A 45 45 0 0 1 520 175 Z" fill="#0f172a" />
    <!-- Wheels -->
    <circle cx="140" cy="175" r="38" fill="#1e293b" stroke="#64748b" stroke-width="8" />
    <circle cx="140" cy="175" r="16" fill="#cbd5e1" />
    <circle cx="470" cy="175" r="38" fill="#1e293b" stroke="#64748b" stroke-width="8" />
    <circle cx="470" cy="175" r="16" fill="#cbd5e1" />
  </g>
  <text x="400" y="450" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="2">PREMIUM FLEET UNIT</text>
</svg>
